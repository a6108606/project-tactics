name: Prototype Core Checks
on:
  push:
    branches: [main, feat/p0-isometric-exploration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test pure C# game logic
        run: dotnet run --project tests/ProjectTactics.Smoke/ProjectTactics.Smoke.csproj -c Release
