name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate planning files
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/GDD-v0.2.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ROADMAP.md
          test -s docs/adr/0002-github-hosted-ci.md
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test C# solutions, when present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          solutions=(*.sln *.slnx)
          if (( ${#solutions[@]} > 0 )); then
            dotnet test "${solutions[0]}" --configuration Release
          else
            echo 'No solution yet; preproduction documentation checked.'
          fi
