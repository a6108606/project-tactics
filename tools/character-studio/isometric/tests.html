<!doctype html><html lang="fr"><meta charset="utf-8"><title>Ryuu isométrique — vérifications</title><h1>Vérifications du sprite et de l’atelier</h1><pre id="report">En cours…</pre><iframe id="app" src="index.html" width="1100" height="1100" title="Atelier réel"></iframe><script>const f=document.querySelector('iframe');f.onload=()=>{const s=f.contentDocument.createElement('script');s.type='module';s.src='tests-runner.js';f.contentDocument.body.append(s);};addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow||!e.data.isoChecks)return;document.querySelector('#report').textContent=JSON.stringify(e.data.isoChecks,null,2);document.body.dataset.result=e.data.isoChecks.fail?'fail':'pass';});</script></html>
